# Claude en GitHub, solo a pedido (spec 008, ADR 0008):
# - "@claude …" en un comentario de un issue o de una PR: Claude responde ahí.
# - Etiqueta "revision-claude" en una PR: la revisan los subagentes
#   revisor-codigo y revisor-contenido (.claude/agents/) y Claude comenta.
#
# Seguridad:
# - Solo el dueño del repo puede dispararlo (author_association OWNER).
# - Nunca corre sobre PR que vienen de forks: los eventos de comentarios
#   corren con los secretos del repo, aunque la PR sea de un fork.
# - El GITHUB_TOKEN solo lee. Los comentarios los publica la app "Claude"
#   con sus propios permisos, así que `main` tiene que estar protegida.
# Necesita la app "Claude" de GitHub instalada y el secreto ANTHROPIC_API_KEY.
name: Claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request:
    types: [labeled]

concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  mencion:
    name: Responder a @claude
    if: >-
      github.event_name != 'pull_request' &&
      contains(github.event.comment.body, '@claude') &&
      github.event.comment.author_association == 'OWNER' &&
      (github.event_name == 'issue_comment' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read
    steps:
      # Un comentario en una PR llega como issue_comment y no dice si la PR
      # viene de un fork: se consulta antes de usar el secreto.
      - name: Cortar si la PR viene de un fork
        if: github.event_name == 'issue_comment' && github.event.issue.pull_request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          fork=$(gh pr view ${{ github.event.issue.number }} --repo ${{ github.repository }} --json isCrossRepository --jq .isCrossRepository)
          if [ "$fork" = "true" ]; then
            echo "La PR viene de un fork: Claude no corre con el secreto del repo."
            exit 1
          fi
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: '--max-turns 15'

  revision:
    name: Revisión con la etiqueta revision-claude
    if: >-
      github.event_name == 'pull_request' &&
      github.event.label.name == 'revision-claude' &&
      github.event.sender.login == github.repository_owner &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    steps:
      # El código de la PR tal cual (no el merge con la base, para que las
      # líneas de los comentarios coincidan) y la historia completa, para
      # compararlo contra la rama base.
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      # La revisión la hacen los subagentes del repo (.claude/agents/), con
      # los mismos criterios que en una sesión local. Solo leen; la sesión
      # principal junta los hallazgos y los publica.
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Revisá la PR #${{ github.event.pull_request.number }} de ${{ github.repository }}.
            Los cambios son `git diff origin/${{ github.event.pull_request.base.ref }}...HEAD`
            (la lista de archivos sale con `--name-only`). No modifiques archivos.

            1. Pasale al subagente `revisor-codigo` ese rango de diff y la lista
               de archivos. Aclarale que revise el rango y no `git diff` contra HEAD.
            2. Si la PR cambia texto visible (`src/content/`, `src/i18n/`,
               `src/pages/`, `src/components/` o `docs/guia-ia/`), pasale al
               subagente `revisor-contenido` solo esos archivos. Si no, no lo uses.
               Corré los dos en paralelo cuando correspondan.
            3. Cada hallazgo Bloqueante o Importante que apunte a una línea
               cambiada en la PR va como comentario en esa línea, con la
               corrección propuesta.
            4. Al final, un solo comentario en la PR con
               `gh pr comment ${{ github.event.pull_request.number }} --body "…"`: los
               hallazgos agrupados por gravedad (incluidas las sugerencias), qué
               revisores corrieron y el veredicto ("Listo para merge" o
               "Requiere cambios"). Si no hay hallazgos, decilo en una línea.
          claude_args: >-
            --max-turns 30
            --allowedTools "Agent,Task,Read,Grep,Glob,Bash(git diff:*),Bash(git log:*),Bash(git status:*),Bash(gh pr comment:*),mcp__github_inline_comment__create_inline_comment"
